mixed_precision:
  enabled: false

activation_checkpoint:
  mode: full
  swap_inputs: true

activation_swap: none

compile:
  enabled: false
  mode: default
  fullgraph: false
  dynamic: false
  backend: null
  options: {}
  dynamo_cache_size_limit: 256

dataset:
  _target_: hyper_parallel.data.vlm.build_vlm_dataset
  data_config:
    source_type: online
  data_path: /home/fdd/workspace/datasets/COCO2017/mllm_format_llava_instruct_data.json
  # FOUND ON FIRST ATTEMPT: filter_trainable defaults to true, which runs the
  # full transform over EVERY record during construction (single-threaded, per
  # rank). At 570k real records that is a multi-hour silent startup, not a hang.
  filter_trainable: false
  data_transform:
    _target_: hyper_parallel.data.vlm.kimi_transform.build_kimi_vlm_data_transform
    max_seq_len: 8192
    # No image_max_pixels: native resolution is the point of the 8192 window.
    # A 2250x1500 SAM image costs ~4187 merged vision tokens, so one image plus
    # its caption (~200 tok) needs ~4400 -- it fits, where the 2048 window had to
    # drop the image outright.
    pad_granularity: 128

dataloader:
  # One training step = ONE packed 8K window per rank: the dynamic loader selects
  # samples by token budget (batch_size x max_seq_len = 1 x 8192) and the packing
  # collator concatenates them, padding only the remainder.
  _target_: hyper_parallel.data.batching.DynamicBatchDataLoader
  batch_size: 1
  max_seq_len: 8192
  min_buffered_samples: 8
  collate_fn:
    _target_: hyper_parallel.data.vlm.collator.build_vlm_collator
    # packing: 拼满 8K 窗口（块对角掩码随批次一起下发），只对余量做 padding
    packing: true
    pad_granularity: 128
    max_seq_len: 8192
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  num_workers: 16
  pin_memory: true
  prefetch_factor: 4

optimizer:
  _target_: hyper_parallel.components.optim.builders.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.lr_scheduler.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 50
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: ""
  restore_from: null

debug:
  check_nan_inf: true
  check_dataset: null

profiling:
  enabled: false
  start_step: 3
  end_step: 5
  trace_dir: ./outputs/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false
  rank: 0

loss_fn:
  _target_: hyper_parallel.components.losses.chunked_cross_entropy.ChunkedCausalLMLoss
  chunk_size: 2048
