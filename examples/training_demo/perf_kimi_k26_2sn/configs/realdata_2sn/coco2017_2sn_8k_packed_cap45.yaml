# COCO2017 LLaVA-instruct, 2 SN, TRUE packing to an 8K window, real router, capacity 6.0.
#
# Differs from coco2017_2sn_8k_cap6.yaml in exactly three things:
#   * DynamicBatchDataLoader(batch_size=1, max_seq_len=8192) -- samples are selected by
#     TOKEN BUDGET, so one step is one packed window instead of 256 padded samples;
#   * build_vlm_collator(packing=True) -- short samples are concatenated to fill the
#     window (pad only the remainder) and the batch carries cu_seq_lens plus the
#     block-diagonal mask that keeps attention inside each packed sample;
#   * train_iters 300 -> 1050 (overnight, ends ~09:00).
#
# Why: the padded run measured 48k valid tokens against 2,097,150 padded slots (2.3%),
# MFU 11-15%.  Packing keeps the same 8192-token window per rank -- same step cost -- but
# fills it with ~46 real samples, so each overnight step sees ~2.1M valid tokens.
model:
  _target_: examples.training_demo.cropped_kimi_vlm.build_cropped_kimi_vlm
  pretrained_model_name_or_path: /home/fdd/workspace/models/moonshotai/Kimi-K2.6
  config_path: /home/fdd/workspace/models/moonshotai/Kimi-K2.6
  num_hidden_layers: 61
  n_routed_experts: 384
  trust_remote_code: false          # processor 走 native（image_grid_thw 协议）
  local_files_only: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  validate_placement: false

training:
  # 09-22 上午启动 → 明早 09:00（09-23）约 24h；packed 步时预计 45-50s ⇒ 1800 步
  train_iters: 1800
  train_samples: null
  eval_iters: 0

  global_batch_size: 256
  micro_batch_size: 1

  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  enable_full_determinism: false

  # Per-card peak dense BF16 TFLOPS for MFU normalization (400 = the team's
  # HP_MFU_PEAK_TFLOPS convention); MFU is skipped while unset.
  peak_tflops: 400.0

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 128
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 256
  edp_shard_size: 2
  enable_offload: true
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

plan_overrides:
  # seq2048 variant: the seq4096 run OOM'd at step 0 (54.59GB allocated on NPU,
  # i.e. our own working set, vs 44.25GB for the text-tower-only full run).
  # NB: the 166 vision-tower leaf specs below are required whenever EP >= 1
  # (their role-based boundaries collapse under whole-tower replication, so the
  # planner needs explicit per-leaf parameter specs to pass the coverage check).
  # FSDP-only runs (ep_size: 1, e.g. the train_kimi_vlm demo) do not need them.
  # 文本塔全部 norm 换成融合 NPU RMSNorm（61 层 x 4 处 + 最终 norm）。
  # 机制要求：每个 pattern 至少命中一个模块，且命中模块类型必须完全匹配，
  # 因此 FQN 写全；RMSNorm 组件复用源模块的 weight/eps（state_dict 与切分均不变）。
  - match:
      - "model.language_model.*.input_layernorm"
      - "model.language_model.*.post_attention_layernorm"
      - "model.language_model.*.self_attn.q_a_layernorm"
      - "model.language_model.*.self_attn.kv_a_layernorm"
      - model.language_model.norm
    module_type: transformers.models.deepseek_v3.modeling_deepseek_v3.DeepseekV3RMSNorm
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.RMSNorm

  # 文本塔 MoE 走 EP（deepseekv3 archetype；排除 first_k_dense_replace=1 的稠密 layer0）
  - match: "model.language_model.layers.[123456789]*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.distributed.expert_parallel.recipes.deepseekv3_ep_compute_fn
      # Real MoE routing: no fixed plan, so loss/grad_norm are meaningful.
      fix_router: false
      # 容量上限 6.0：实测（r45）真实路由在该几何下 factor 6 是"仍装得下"的边界
      # （peak 58.39 GB，drop 22%）；7 以上即 OOM。有效容量≈factor/2（group-limited topk
      # 使每个 token 只能落到一半专家）。
      capacity_factor: 4.5
      use_grouped_gemm: true
      overlap_shared_expert: true

  - match: model.vision_tower.layers.0.attn.q_proj
    params:
      weight: {tp: replicate}
      bias: {tp: replicate}
  - match: model.vision_tower.layers.0.attn.k_proj
